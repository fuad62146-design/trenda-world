<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trenda World - ترندا العالم</title>
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- نافذة تسجيل الدخول وانشاء الحساب -->
    <div id="auth-container" class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-700">
        <h2 id="auth-title" class="text-3xl font-bold text-center mb-2 text-indigo-400">Trenda World</h2>
        <p class="text-center text-gray-400 text-sm mb-6">تطبيق ترندا العالم - الحزمة: com.trendatlas.world</p>
        
        <form id="auth-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">البريد الإلكتروني</label>
                <input type="email" id="email" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                <input type="password" id="password" required class="w-full px-4 py-2 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-indigo-500 text-white">
            </div>
            <button type="submit" id="btn-primary" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 font-semibold rounded-lg transition duration-200">دخول</button>
        </form>

        <p class="text-sm text-center text-gray-400 mt-4">
            <span id="toggle-text">ليس لديك حساب؟</span>
            <button id="btn-toggle" class="text-indigo-400 hover:underline font-medium focus:outline-none">إنشاء حساب جديد</button>
        </p>
    </div>

    <!-- لوحة عرض الترندات بعد الدخول -->
    <div id="trends-container" class="hidden w-full max-w-4xl bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-700">
        <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
            <h1 class="text-2xl font-bold text-indigo-400">🌍 ترندا العالم - Trenda World</h1>
            <button id="btn-logout" class="px-4 py-2 bg-red-600 hover:bg-red-700 text-sm font-semibold rounded-lg transition duration-200">تسجيل الخروج</button>
        </div>
        
        <div id="trends-list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <p class="text-gray-400 col-span-2 text-center py-8">جاري تحميل أحدث الترندات من Firestore...</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
